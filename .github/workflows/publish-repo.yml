# Copy this file to .github/workflows/publish-repo.yml in your own repository
# and enable GitHub Pages (Source: GitHub Actions) in repository Settings.
name: Publish Dishko Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build repo.json with SHA-256 hashes
        run: |
          mkdir -p _site
          cp -r extensions _site/extensions
          if [ -d icons ]; then cp -r icons _site/icons; fi
          node scripts/build-repo.mjs \
            --template manifest.template.json \
            --out _site/repo.json \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
